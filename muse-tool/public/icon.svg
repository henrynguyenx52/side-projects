<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Cinema Gradient -->
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Flare Glow -->
    <radialGradient id="flareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.65"/>

  <!-- Subtle Film Perforations on Top and Bottom -->
  <g fill="#334155" opacity="0.4">
    <rect x="76" y="44" width="28" height="20" rx="4"/>
    <rect x="136" y="44" width="28" height="20" rx="4"/>
    <rect x="196" y="44" width="28" height="20" rx="4"/>
    <rect x="256" y="44" width="28" height="20" rx="4"/>
    <rect x="316" y="44" width="28" height="20" rx="4"/>
    <rect x="376" y="44" width="28" height="20" rx="4"/>
    <rect x="436" y="44" width="28" height="20" rx="4"/>

    <rect x="76" y="448" width="28" height="20" rx="4"/>
    <rect x="136" y="448" width="28" height="20" rx="4"/>
    <rect x="196" y="448" width="28" height="20" rx="4"/>
    <rect x="256" y="448" width="28" height="20" rx="4"/>
    <rect x="316" y="448" width="28" height="20" rx="4"/>
    <rect x="376" y="448" width="28" height="20" rx="4"/>
    <rect x="436" y="448" width="28" height="20" rx="4"/>
  </g>

  <!-- Cinema Camera Body & Lens Assembly -->
  <g filter="url(#shadow)">
    <!-- Camera Body Outline / Stylized Clapper & Film Strip Shape -->
    <!-- Film Reel 1 (Top Left) -->
    <circle cx="190" cy="165" r="54" fill="none" stroke="url(#cineGrad)" stroke-width="14"/>
    <circle cx="190" cy="165" r="20" fill="url(#cineGrad)"/>
    <circle cx="190" cy="130" r="8" fill="#18181b"/>
    <circle cx="190" cy="200" r="8" fill="#18181b"/>
    <circle cx="155" cy="165" r="8" fill="#18181b"/>
    <circle cx="225" cy="165" r="8" fill="#18181b"/>

    <!-- Film Reel 2 (Top Right) -->
    <circle cx="310" cy="165" r="46" fill="none" stroke="url(#cineGrad)" stroke-width="12"/>
    <circle cx="310" cy="165" r="16" fill="url(#cineGrad)"/>
    <circle cx="310" cy="135" r="6" fill="#18181b"/>
    <circle cx="310" cy="195" r="6" fill="#18181b"/>
    <circle cx="280" cy="165" r="6" fill="#18181b"/>
    <circle cx="340" cy="165" r="6" fill="#18181b"/>

    <!-- Main Matte Box / Lens Outer Ring -->
    <rect x="110" y="210" width="240" height="175" rx="32" fill="#1e293b" stroke="url(#cineGrad)" stroke-width="8"/>
    
    <!-- Anamorphic Lens Barrel (Right Extension) -->
    <path d="M 350 255 L 418 220 L 418 340 L 350 305 Z" fill="url(#cineGrad)" opacity="0.9"/>
    <line x1="418" y1="220" x2="418" y2="340" stroke="#fde047" stroke-width="6" stroke-linecap="round"/>

    <!-- Circular Aperture & Glass Elements -->
    <circle cx="230" cy="297" r="64" fill="#0f172a" stroke="url(#cineGrad)" stroke-width="10"/>
    <circle cx="230" cy="297" r="42" fill="url(#cineGrad)" opacity="0.25"/>

    <!-- Cinema Aperture Blades (Geometric Iris) -->
    <polygon points="230,245 255,275 240,305 210,310 195,280 215,255" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.7"/>

    <!-- Glowing Core Pulse -->
    <circle cx="230" cy="297" r="26" fill="url(#flareGlow)" filter="url(#glow)"/>

    <!-- The Muse Diamond Sparkle (Center of Lens) -->
    <path d="M 230 268 Q 230 297 201 297 Q 230 297 230 326 Q 230 297 259 297 Q 230 297 230 268 Z" fill="#ffffff" filter="url(#glow)"/>

    <!-- Dynamic Anamorphic Lens Flare Line (Horizontal Streak) -->
    <line x1="130" y1="297" x2="330" y2="297" stroke="#67e8f9" stroke-width="3" opacity="0.85" filter="url(#glow)" stroke-linecap="round"/>
    <circle cx="230" cy="297" r="6" fill="#ffffff"/>

    <!-- Play/Forward Triangle Accent on the lens -->
    <polygon points="370,270 395,280 370,290" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Modern Muse Sparkle 4-Point Star (Top Right Corner) -->
  <g transform="translate(375, 95)" filter="url(#glow)">
    <path d="M 0 -35 Q 0 0 -35 0 Q 0 0 0 35 Q 0 0 35 0 Q 0 0 0 -35 Z" fill="url(#cineGrad)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
  </g>

  <!-- Small Ambient Sparkle (Bottom Left) -->
  <g transform="translate(95, 415)" filter="url(#glow)" opacity="0.8">
    <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#fbbf24"/>
  </g>
</svg>
