<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VieNeu-TTS - Thư viện nghe thử giọng đọc</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-border: #23304d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2.5rem 1.5rem;
      min-height: 100vh;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem auto;
      text-align: center;
    }
    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, #34d399, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }
    .sample-text {
      background: rgba(21, 29, 47, 0.85);
      border: 1px solid var(--card-border);
      padding: 1.1rem 1.6rem;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 500;
      color: #f1f5f9;
      max-width: 820px;
      margin: 0 auto 1.8rem auto;
      line-height: 1.6;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 2.2rem;
    }
    .filter-btn {
      background: #151d2f;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1.15rem;
      border-radius: 20px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.35rem;
    }
    .voice-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .voice-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
      border-color: #3b82f6;
    }
    .voice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .voice-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #1e293b;
      color: #fff;
      border-color: #64748b;
    }
    .desc {
      font-size: 0.88rem;
      color: #94a3b8;
    }
    .tags {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.75rem;
      padding: 0.22rem 0.65rem;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .tag.bac { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }
    .tag.trung { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
    .tag.nam { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .tag.female { background: rgba(236, 72, 153, 0.18); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.35); }
    .tag.male { background: rgba(14, 165, 233, 0.18); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.35); }
    .tag.star { background: rgba(234, 179, 8, 0.22); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.45); }
    audio {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      outline: none;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🦜 VieNeu-TTS Voice Showcase</h1>
    <p class="subtitle">Nghe thử và so sánh 25 giọng đọc VieNeu-TTS v3 Turbo</p>
    <div class="sample-text">
      "Xin chào các con vợ, dạo này các con vợ có khoẻ không."
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterVoices('all')">Tất cả (25)</button>
      <button class="filter-btn" onclick="filterVoices('featured')">⭐ Đề xuất (10)</button>
      <button class="filter-btn" onclick="filterVoices('bac')">Miền Bắc (15)</button>
      <button class="filter-btn" onclick="filterVoices('trung')">Miền Trung (2)</button>
      <button class="filter-btn" onclick="filterVoices('nam')">Miền Nam (8)</button>
      <button class="filter-btn" onclick="filterVoices('male')">Giọng Nam (14)</button>
      <button class="filter-btn" onclick="filterVoices('female')">Giọng Nữ (11)</button>
    </div>
  </header>

  <div class="container" id="gallery"></div>

  <script>
    let voices = [];

    function copyId(name, btn) {
      navigator.clipboard.writeText(name).then(() => {
        const orig = btn.innerText;
        btn.innerText = "Đã sao chép!";
        btn.style.borderColor = "#10b981";
        btn.style.color = "#10b981";
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.borderColor = "";
          btn.style.color = "";
        }, 1500);
      });
    }

    function render(list) {
      const container = document.getElementById("gallery");
      container.innerHTML = "";
      list.forEach(v => {
        const card = document.createElement("div");
        card.className = "voice-card";
        
        const tags = [];
        if (v.featured) tags.push(`<span class="tag star">⭐ Top #${v.featured}</span>`);
        const regClass = v.region === 'Bắc' ? 'bac' : (v.region === 'Trung' ? 'trung' : 'nam');
        tags.push(`<span class="tag ${regClass}">Miền ${v.region}</span>`);
        tags.push(`<span class="tag ${v.gender}">${v.gender === 'male' ? 'Nam' : 'Nữ'}</span>`);
        
        card.innerHTML = `
          <div class="voice-header">
            <span class="voice-name">${v.name}</span>
            <button class="copy-btn" onclick="copyId('${v.name}', this)" title="Sao chép tên giọng">Copy "${v.name}"</button>
          </div>
          <div class="desc">${v.description}</div>
          <div class="tags">${tags.join(' ')}</div>
          <audio controls preload="none" src="${v.filename}"></audio>
        `;
        container.appendChild(card);
      });
    }

    function filterVoices(type) {
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
      
      if (type === "all") {
        render(voices);
      } else if (type === "featured") {
        render(voices.filter(v => v.featured != null));
      } else if (type === "bac") {
        render(voices.filter(v => v.region === "Bắc"));
      } else if (type === "trung") {
        render(voices.filter(v => v.region === "Trung"));
      } else if (type === "nam") {
        render(voices.filter(v => v.region === "Nam"));
      } else if (type === "male") {
        render(voices.filter(v => v.gender === "male"));
      } else if (type === "female") {
        render(voices.filter(v => v.gender === "female"));
      }
    }

    fetch('voices_metadata.json')
      .then(res => res.json())
      .then(data => {
        voices = data;
        render(voices);
      })
      .catch(err => {
        console.error("Không tải được voices_metadata.json", err);
      });
  </script>
</body>
</html>
