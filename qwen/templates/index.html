<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Image edit</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #e4ddd4;
      --paper: #f6f3ee;
      --card: #fffcf8;
      --accent: #9a3412;
      --accent-ink: #fff7f3;
      --danger: #9f1239;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 "Avenir Next", "Segoe UI", sans-serif;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 48px;
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .lede { margin: 0 0 22px; color: var(--muted); }
    form, .stage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; }
    .upload-row, .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    button, .file-button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled, .file-button[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
    .file-button, #abort {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    #generate { background: var(--accent); color: var(--accent-ink); }
    #abort { color: var(--danger); border-color: #fecdd3; }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      margin: 16px 0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: inherit;
      font: inherit;
    }
    .preview {
      margin-top: 12px;
      display: none;
    }
    .preview img, .stage img {
      width: 100%;
      border-radius: 12px;
      display: block;
      background: #efeae3;
    }
    .filename { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .queue {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
    }
    .queue:empty { display: none; }
    .queue-item { position: relative; margin: 0; }
    .queue-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background: #efeae3;
    }
    .queue-item span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      line-height: 1;
    }
    .stage-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      gap: 8px;
      padding-bottom: 4px;
      background: var(--card);
    }
    .stage-tools { display: flex; justify-content: flex-end; }
    .stage-tools a, .card a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    .gallery[hidden] { display: none; }
    .card {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }
    .card[data-phase="running"] { border-color: #fdba74; }
    .card[data-phase="done"] { border-color: #bbf7d0; }
    .card[data-phase="error"] { border-color: #fecdd3; }
    .card-head, .pair { display: grid; gap: 8px; }
    .card-head { grid-template-columns: 1fr auto; align-items: baseline; }
    .card-head strong, .card-head span { font-size: 13px; }
    .card-head strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-head span { color: var(--muted); font-weight: 650; }
    .pair { grid-template-columns: 1fr 1fr; }
    .pair.single { grid-template-columns: 1fr; }
    .pair figure { margin: 0; }
    .pair figcaption {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }
    .pair img, .placeholder {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      background: #efeae3;
    }
    .placeholder {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--line);
      text-align: center;
      padding: 8px;
    }
    .stage {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status { margin: 0; font-weight: 650; overflow-wrap: anywhere; }
    .detail { margin: 0; color: var(--muted); }
    .progress { display: grid; gap: 6px; }
    .progress[hidden] { display: none; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      font-weight: 650;
    }
    .progress-meta span:last-child {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 280ms ease;
    }
    .empty {
      flex: 1;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      min-height: 280px;
      text-align: center;
      padding: 20px;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Edit photos</h1>
      <p class="lede">The same instruction is applied to every photo, one after another. Each result keeps the original size.</p>
      <form id="editor">
        <label for="image">Photos</label>
        <div class="upload-row">
          <input id="image" name="images" type="file" accept="image/png,image/jpeg,image/webp,image/tiff" multiple>
          <button class="file-button" id="pick" type="button">Add images</button>
          <button class="file-button" id="clear" type="button" disabled>Clear</button>
        </div>
        <ul class="queue" id="queue"></ul>
        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" placeholder="Change her jacket to a red wool coat. Keep the face, pose, and background."></textarea>
        <div class="actions">
          <button id="generate" type="submit" disabled>Generate</button>
          <button id="abort" type="button" disabled>Abort</button>
        </div>
      </form>
    </section>
    <section class="stage">
      <div class="stage-head">
        <p class="status" id="status">Starting.</p>
        <p class="detail" id="detail"></p>
        <div class="progress" id="progress" hidden>
          <div class="progress-meta">
            <span id="progress-label">Starting edit</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Batch progress"><span id="fill"></span></div>
        </div>
        <div class="stage-tools">
          <a id="download-all" href="/api/batch.zip" download="edited-images.zip" hidden>Download all</a>
        </div>
      </div>
      <div class="empty" id="empty">Edited photos show up here.</div>
      <div class="gallery" id="gallery" hidden></div>
    </section>
  </main>
  <script>
    const imageInput = document.querySelector("#image");
    const pick = document.querySelector("#pick");
    const clear = document.querySelector("#clear");
    const queue = document.querySelector("#queue");
    const prompt = document.querySelector("#prompt");
    const generate = document.querySelector("#generate");
    const abort = document.querySelector("#abort");
    const statusEl = document.querySelector("#status");
    const detail = document.querySelector("#detail");
    const progress = document.querySelector("#progress");
    const progressLabel = document.querySelector("#progress-label");
    const progressPercent = document.querySelector("#progress-percent");
    const bar = document.querySelector("#bar");
    const fill = document.querySelector("#fill");
    const empty = document.querySelector("#empty");
    const gallery = document.querySelector("#gallery");
    const downloadAll = document.querySelector("#download-all");
    const cards = new Map();
    let phase = "starting";
    let holding = false;
    let submitInFlight = false;
    let statusEpoch = 0;
    let notice = "";
    let files = [];
    let batchPreviews = [];
    let editingLabel = "Editing…";

    pick.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", () => {
      for (const file of imageInput.files) {
        files.push({ id: crypto.randomUUID(), file, url: URL.createObjectURL(file) });
      }
      imageInput.value = "";
      renderQueue();
      syncButtons();
    });
    clear.addEventListener("click", () => {
      for (const entry of files) URL.revokeObjectURL(entry.url);
      files = [];
      renderQueue();
      syncButtons();
    });
    prompt.addEventListener("input", syncButtons);

    document.querySelector("#editor").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!files.length) return;
      const body = new FormData();
      for (const entry of files) body.append("images", entry.file);
      body.append("prompt", prompt.value.trim());
      batchPreviews = files.map((entry) => entry.url);
      holding = true;
      submitInFlight = true;
      notice = "";
      renderProgress({ phase: "running", step: 0, total: 8, batch_index: 1, batch_count: files.length, items: [] });
      syncButtons();
      try {
        const response = await fetch("/api/generate", { method: "POST", body });
        const payload = await response.json();
        if (!response.ok) failStart(payload.error || "Could not start.");
      } catch (_err) {
        failStart("Could not start the edit.");
      } finally {
        submitInFlight = false;
        statusEpoch += 1;
      }
      if (holding) poll();
    });

    abort.addEventListener("click", async () => {
      abort.disabled = true;
      await fetch("/api/abort", { method: "POST" });
    });

    function failStart(message) {
      holding = false;
      notice = message;
      progress.hidden = true;
      statusEl.textContent = message;
      syncButtons();
    }

    function renderQueue() {
      queue.replaceChildren();
      for (const entry of files) {
        const item = document.createElement("li");
        item.className = "queue-item";
        const img = document.createElement("img");
        img.src = entry.url;
        img.alt = "";
        const caption = document.createElement("span");
        caption.textContent = entry.file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "thumb-remove";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Remove ${entry.file.name}`);
        remove.addEventListener("click", () => {
          URL.revokeObjectURL(entry.url);
          files = files.filter((candidate) => candidate.id !== entry.id);
          renderQueue();
          syncButtons();
        });
        item.append(img, caption, remove);
        queue.append(item);
      }
    }

    function syncButtons() {
      const hasImage = files.length > 0;
      const hasPrompt = prompt.value.trim().length > 0;
      const generating = holding || phase === "running";
      const canGenerate = ["ready", "done", "aborted", "error"].includes(phase);
      generate.disabled = generating || !canGenerate || !hasImage || !hasPrompt;
      if (generating) {
        generate.textContent = editingLabel;
      } else if (files.length > 1) {
        generate.textContent = `Generate ${files.length}`;
      } else {
        generate.textContent = "Generate";
      }
      abort.disabled = phase !== "running";
      pick.disabled = generating;
      clear.disabled = generating || !hasImage;
      imageInput.disabled = generating;
      prompt.disabled = generating;
      for (const button of queue.querySelectorAll("button")) button.disabled = generating;
    }

    function renderProgress(payload) {
      const count = payload.batch_count || 1;
      const index = payload.batch_index || 1;
      const total = payload.total || 8;
      const step = payload.step || 0;
      const finished = payload.phase === "done" && !holding;
      const stopped = payload.phase === "aborted" && !holding;
      const editing = payload.phase === "running" || (holding && !finished && !stopped);
      progress.hidden = !(editing || finished || stopped);
      if (progress.hidden) return;
      const doneCount = (payload.items || []).filter((item) => item.phase === "done" || item.phase === "error" || item.phase === "aborted").length;
      let percent = 0;
      if (finished) percent = 100;
      else if (stopped) percent = Math.round((doneCount / count) * 100);
      else percent = Math.min(99, Math.round((((Math.max(index, 1) - 1) + (step / total)) / count) * 100));
      fill.style.width = `${percent}%`;
      bar.setAttribute("aria-valuemax", "100");
      bar.setAttribute("aria-valuenow", String(percent));
      if (finished) progressLabel.textContent = count > 1 ? "Batch complete" : "Edit complete";
      else if (stopped) progressLabel.textContent = "Stopped";
      else if (count > 1) progressLabel.textContent = step > 0 ? `Image ${index} of ${count} · Step ${step} of ${total}` : `Image ${index} of ${count}`;
      else progressLabel.textContent = step > 0 ? `Step ${step} of ${total}` : "Starting edit";
      progressPercent.textContent = `${percent}%`;
    }

    function renderGallery(payload) {
      const items = payload.items || [];
      const anyDone = items.some((item) => item.result_url);
      const settled = ["done", "aborted", "error"].includes(payload.phase);
      downloadAll.hidden = !(settled && anyDone && items.length > 1);
      if (payload.output_dir) downloadAll.download = `${payload.output_dir}.zip`;
      if (!items.length) {
        gallery.hidden = true;
        gallery.replaceChildren();
        cards.clear();
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      gallery.hidden = false;
      const seen = new Set();
      items.forEach((item, index) => {
        seen.add(item.id);
        let card = cards.get(item.id);
        if (!card) {
          card = createCard(item, batchPreviews[index] || "");
          cards.set(item.id, card);
          gallery.append(card.root);
        }
        updateCard(card, item);
      });
      for (const [id, card] of cards) {
        if (seen.has(id)) continue;
        card.root.remove();
        cards.delete(id);
      }
    }

    function createCard(item, previewUrl) {
      const root = document.createElement("article");
      root.className = "card";
      const head = document.createElement("div");
      head.className = "card-head";
      const name = document.createElement("strong");
      name.textContent = item.name;
      const state = document.createElement("span");
      head.append(name, state);
      const pair = document.createElement("div");
      pair.className = previewUrl ? "pair" : "pair single";
      const before = document.createElement("figure");
      const beforeImg = document.createElement("img");
      beforeImg.alt = `Original ${item.name}`;
      beforeImg.src = previewUrl;
      const beforeCaption = document.createElement("figcaption");
      beforeCaption.textContent = "Original";
      before.append(beforeImg, beforeCaption);
      if (!previewUrl) before.hidden = true;
      const after = document.createElement("figure");
      const afterImg = document.createElement("img");
      afterImg.alt = `Edited ${item.name}`;
      afterImg.hidden = true;
      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      const afterCaption = document.createElement("figcaption");
      afterCaption.textContent = "Edited";
      after.append(afterImg, placeholder, afterCaption);
      pair.append(before, after);
      const download = document.createElement("a");
      download.hidden = true;
      download.textContent = "Download";
      root.append(head, pair, download);
      return { root, state, afterImg, placeholder, download };
    }

    function updateCard(card, item) {
      card.root.dataset.phase = item.phase;
      card.state.textContent = item.message || item.phase;
      card.placeholder.textContent = item.phase === "pending" ? "Waiting" : (item.message || "Editing");
      if (item.result_url) {
        const next = `${item.result_url}?t=${item.seed || ""}`;
        if (card.afterImg.getAttribute("src") !== next) card.afterImg.src = next;
        card.afterImg.hidden = false;
        card.placeholder.hidden = true;
        card.download.hidden = false;
        card.download.href = item.result_url;
        const stem = item.name.replace(/\.[^.]+$/, "") || "image";
        card.download.download = `${stem}-edited.png`;
      }
    }

    async function poll() {
      const epoch = statusEpoch;
      try {
        const response = await fetch("/api/status");
        if (epoch !== statusEpoch) return;
        const payload = await response.json();
        phase = payload.phase;
        if (!submitInFlight && holding && phase !== "ready" && phase !== "starting") holding = false;
        if (payload.phase === "running" || payload.phase === "loading") notice = "";
        editingLabel = payload.phase === "running" && (payload.batch_count || 0) > 1
          ? `Editing ${payload.batch_index} of ${payload.batch_count}…`
          : "Editing…";
        statusEl.textContent = notice || payload.message || payload.phase;
        const seed = payload.seed == null ? "" : `Seed ${payload.seed}. `;
        const count = payload.batch_count || 0;
        const abortNote = count > 1
          ? "Abort finishes the current step, then skips the photos still waiting."
          : "Abort finishes the step that is already on the GPU.";
        detail.textContent = payload.phase === "running" ? `${seed}${abortNote}` : seed;
        renderProgress(payload);
        renderGallery(payload);
        syncButtons();
      } catch (_err) {
        statusEl.textContent = "Lost contact with the local server.";
      }
    }

    poll();
    setInterval(poll, 1000);
  </script>
</body>
</html>
