  <script>
    const HAND_W = 230;
    const TIP_X = 22 * (HAND_W / 545);
    const TIP_Y = 19 * (HAND_W / 545);
    const tl = gsap.timeline({ paused: true });
    const hand = "#bean-hand";

    function write(sel, at, dur) {
      tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, {
        clipPath: "inset(0 0% 0 0)", duration: dur, ease: "power1.out", immediateRender: false,
      }, at);
    }
    function trace(shade, box, at, dur) {
      const cx = box.x + box.w / 2;
      const cy = box.y + box.h / 2;
      const rx = box.w * 0.46;
      const ry = box.h * 0.46;
      tl.fromTo(shade, { "--sweep": 0 }, {
        "--sweep": 360,
        duration: dur,
        ease: "none",
        immediateRender: false,
        onUpdate() {
          const a = this.progress() * Math.PI * 2;
          gsap.set(hand, {
            opacity: 1,
            x: cx + rx * Math.sin(a) - TIP_X,
            y: cy - ry * Math.cos(a) - TIP_Y,
          });
        },
      }, at);
      tl.set(hand, { opacity: 0 }, at + dur);
    }

    write("#bean-title .wipe", 0.12, 0.45);
    trace("#bean-beans-shade", { x: 130, y: 560, w: 400, h: 219 }, 0.45, 1.2);
    trace("#bean-bowl-shade", { x: 590, y: 575, w: 250, h: 179 }, 1.8, 1.15);
    write("#bean-n1 .wipe", 3.1, 0.45);
    write("#bean-n2 .wipe", 3.9, 0.4);
    write("#bean-n3 .wipe", 5.15, 0.45);

    window.__timelines["bean"] = tl;
