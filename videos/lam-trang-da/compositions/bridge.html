    </div>
    <img id="bridge-hand" class="hand" src="assets/sketches/hand.png" alt="" data-layout-allow-overflow />
  </div>
  <script>
    const HAND_W = 230;
    const TIP_X = 22 * (HAND_W / 545);
    const TIP_Y = 19 * (HAND_W / 545);
    const tl = gsap.timeline({ paused: true });
    const hand = "#bridge-hand";

    function write(sel, at, dur) {
      tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, {
        clipPath: "inset(0 0% 0 0)", duration: dur, ease: "power1.out", immediateRender: false,
      }, at);
    }
    function trace(shade, box, at, dur) {
      const cx = box.x + box.w / 2;
      const cy = box.y + box.h / 2;
      const rx = box.w * 0.46;
      const ry = box.h * 0.46;
      tl.fromTo(shade, { "--sweep": 0 }, {
        "--sweep": 360,
        duration: dur,
        ease: "none",
        immediateRender: false,
        onUpdate() {
          const a = this.progress() * Math.PI * 2;
          gsap.set(hand, {
            opacity: 1,
            x: cx + rx * Math.sin(a) - TIP_X,
            y: cy - ry * Math.cos(a) - TIP_Y,
          });
        },
      }, at);
      tl.set(hand, { opacity: 0 }, at + dur);
    }

    write("#bridge-title .wipe", 0.1, 0.5);
    trace("#bridge-cells-shade", { x: 140, y: 470, w: 320, h: 397 }, 0.7, 1.2);
    write("#bridge-lab-a .wipe", 1.98, 0.4);
    trace("#bridge-sun-shade", { x: 585, y: 548, w: 230, h: 233 }, 2.15, 1.15);
    write("#bridge-lab-b .wipe", 3.4, 0.4);
    write("#bridge-note .wipe", 3.55, 0.4);

    window.__timelines["bridge"] = tl;
  </script>
