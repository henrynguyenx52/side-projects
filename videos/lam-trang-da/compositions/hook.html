    @font-face { font-family: Text; font-style: normal; font-weight: 700; font-display: block; src: url("assets/fonts/bevn-700-05.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    .note {
      top: 1120px;

    .pic { overflow: hidden; }

      position: absolute;

      -webkit-mask-image: conic-gradient(from -90deg at 50% 50%, #000 calc(var(--sweep) * 1deg), transparent calc(var(--sweep) * 1deg));
      mask-image: conic-gradient(from -90deg at 50% 50%, #000 calc(var(--sweep) * 1deg), transparent calc(var(--sweep) * 1deg));

      position: absolute;

  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920" data-layout-allow-overlap>
    <div class="kicker">MẸO DA</div>
    <div id="hook-title" class="clip slot title" data-start="0.08" data-duration="5.30">
      <span class="wipe">Da vẫn <span class="blue">sạm?</span></span>
    </div>
    <div id="hook-jar" class="clip slot pic" data-start="1.30" data-duration="4.05" style="left: 390px; top: 500px; width: 300px; height: 328px">
      <div id="hook-jar-shade" class="shade">
        <img src="assets/sketches/jar.png" alt="" />
      </div>
    </div>
    <svg id="hook-marks" class="clip" data-start="2.50" data-duration="2.85" viewBox="0 0 1080 1920">
      <line id="hook-x1" x1="440" y1="560" x2="640" y2="760" />
      <line id="hook-x2" x1="640" y1="560" x2="440" y2="760" />
    </svg>
    <div id="hook-note" class="clip slot note" data-start="3.50" data-duration="1.85">
      <span class="wipe">Khoan mua thêm</span>
    </div>
    <img id="hook-hand" class="hand" src="assets/sketches/hand.png" alt="" data-layout-allow-overflow />
  </div>
  <script>
    const HAND_W = 230;
    const TIP_X = 22 * (HAND_W / 545);
    const TIP_Y = 19 * (HAND_W / 545);
    const tl = gsap.timeline({ paused: true });
    const hand = "#hook-hand";

    function write(sel, at, dur) {
      tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, {
        clipPath: "inset(0 0% 0 0)", duration: dur, ease: "power1.out", immediateRender: false,
      }, at);
    }
    function showHand(x, y, at) {
      tl.set(hand, { opacity: 1, x: x - TIP_X, y: y - TIP_Y }, at);
    }
    function moveHand(x0, y0, x1, y1, at, dur) {
      tl.fromTo(hand, { x: x0 - TIP_X, y: y0 - TIP_Y }, {
        x: x1 - TIP_X, y: y1 - TIP_Y, duration: dur, ease: "none", immediateRender: false,
      }, at);
    }
    function hideHand(at) {
      tl.to(hand, { opacity: 0, duration: 0.08, ease: "power1.in" }, at);
    }
    function trace(shade, box, at, dur) {
      const cx = box.x + box.w / 2;
      const cy = box.y + box.h / 2;
      const rx = box.w * 0.46;
      const ry = box.h * 0.46;
      tl.fromTo(shade, { "--sweep": 0 }, {
        "--sweep": 360,
        duration: dur,
        ease: "none",
        immediateRender: false,
        onUpdate() {
          const a = this.progress() * Math.PI * 2;
          gsap.set(hand, {
            opacity: 1,
            x: cx + rx * Math.sin(a) - TIP_X,
            y: cy - ry * Math.cos(a) - TIP_Y,
          });
        },
      }, at);
      tl.set(hand, { opacity: 0 }, at + dur);
    }

    write("#hook-title .wipe", 0.08, 0.5);
    trace("#hook-jar-shade", { x: 390, y: 500, w: 300, h: 328 }, 1.3, 1.2);

    const xLen = Math.hypot(200, 200);
    tl.set("#hook-x1, #hook-x2", { strokeDasharray: xLen, strokeDashoffset: xLen }, 0);
    tl.to("#hook-x1", { strokeDashoffset: 0, duration: 0.48, ease: "none" }, 2.55);
    showHand(440, 560, 2.55);
    moveHand(440, 560, 640, 760, 2.55, 0.48);
    tl.to("#hook-x2", { strokeDashoffset: 0, duration: 0.42, ease: "none" }, 3.05);
    moveHand(640, 560, 440, 760, 3.05, 0.42);
    hideHand(3.47);
    write("#hook-note .wipe", 3.5, 0.42);

    window.__timelines["hook"] = tl;
  </script>
