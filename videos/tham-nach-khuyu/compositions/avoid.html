    function trace(shade, box, at, dur) {

      const cy = box.y + box.h / 2;

            x: cx + rx * Math.sin(a) - TIP_X,
            y: cy - ry * Math.cos(a) - TIP_Y,

        },
      }, at);
      tl.set(hand, { opacity: 0 }, at + dur);
    }
